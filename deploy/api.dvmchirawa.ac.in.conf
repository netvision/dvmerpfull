# Nginx site config for api.dvmchirawa.ac.in
# Place this file at /etc/nginx/sites-available/api.dvmchirawa.ac.in
# Then: sudo ln -s /etc/nginx/sites-available/api.dvmchirawa.ac.in /etc/nginx/sites-enabled/
# Then: sudo certbot --nginx -d api.dvmchirawa.ac.in

server {
    listen 80;
    server_name api.dvmchirawa.ac.in;

    # Redirect HTTP → HTTPS (Certbot will manage this block)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.dvmchirawa.ac.in;

    # SSL certs managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/api.dvmchirawa.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dvmchirawa.ac.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Proxy all requests to uvicorn
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Serve uploaded files directly (PDF, images, xlsx)
    location /uploads/ {
        alias /home/dev/dvmerpfull/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 60M;
}
