# Nginx site config for fastapi.dvmchirawa.ac.in
# Place this file at /etc/nginx/sites-available/fastapi.dvmchirawa.ac.in
# Then: sudo ln -s /etc/nginx/sites-available/fastapi.dvmchirawa.ac.in /etc/nginx/sites-enabled/
# Then: sudo certbot --nginx -d fastapi.dvmchirawa.ac.in
# Certbot will add the HTTPS server block automatically after certificate issuance.

server {
    listen 80;
    server_name fastapi.dvmchirawa.ac.in;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Proxy all requests to uvicorn
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Serve uploaded files directly (PDF, images, xlsx)
    location /uploads/ {
        alias /home/dev/dvmerpfull/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 60M;
}